[package]
name = "fpilot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
ignore = "0.4.33"
image = "0.25.10"
libc = "0.2.190"
notify = "8.2.0"
raw-window-handle = "0.6"
rayon = "1.12.0"
syntect = "5.3.0"
trash = "5.2.9"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Keep debug builds usable: optimize dependencies (image decoding, syntect).
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# egui-winit with two small fpilot patches (see vendor/egui-winit/FPILOT_PATCHES.md).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
