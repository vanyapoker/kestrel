[package]
name = "kestrel"
version = "0.7.0"
edition = "2024"
description = "A fast, keyboard-friendly file manager for Omarchy, inspired by File Pilot"
license = "MIT"
repository = "https://github.com/vanyapoker/kestrel"

[dependencies]
async-channel = "2"
chrono = "0.4.45"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "links"] }
ignore = "0.4.33"
image = "0.25.10"
png = "0.18.1"
libc = "0.2.190"
notify = "8.2.0"
raw-window-handle = "0.6"
rayon = "1.12.0"
serde_json = { version = "1", features = ["raw_value"] }
syntect = "5.3.0"
trash = "5.2.9"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
zbus = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Keep debug builds usable: optimize dependencies (image decoding, syntect).
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# egui-winit with two small kestrel patches (see vendor/egui-winit/KESTREL_PATCHES.md).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
